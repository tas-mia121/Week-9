<h2>Update Product</h2>

<form *ngIf="product" (ngSubmit)="updateProduct()">

  <label>ID:</label>
  <input type="number" [(ngModel)]="product.id" name="id" />

  <label>Name:</label>
  <input type="text" [(ngModel)]="product.name" name="name" />

  <label>Type:</label>
  <input type="text" [(ngModel)]="product.type" name="type" />

  <label>Description:</label>
  <textarea [(ngModel)]="product.description" name="description"></textarea>

  <label>Price:</label>
  <input type="number" [(ngModel)]="product.price" name="price" />

  <label>Units:</label>
  <input type="number" [(ngModel)]="product.units" name="units" />

  <button type="submit">Update Product</button>
</form>
