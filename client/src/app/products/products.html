<h1>Products</h1>

<a routerLink="/add-product">Add New Product</a>

<br><br>

<table border="1" cellpadding="10">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Type</th>
      <th>Description</th>
      <th>Price</th>
      <th>Units</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let product of products">
      <td>{{ product.id }}</td>
      <td>{{ product.name }}</td>
      <td>{{ product.type }}</td>
      <td>{{ product.description }}</td>
      <td>${{ product.price | number:'1.2-2' }}</td>
      <td>{{ product.units }}</td>

```

    </a>

    &nbsp;

    <button (click)="deleteProduct(product._id)">

    </button>
  </td>
</tr>
